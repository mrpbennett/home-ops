---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atuin
  namespace: atuin
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: atuin
  template:
    metadata:
      labels:
        io.kompose.service: atuin
    spec:
      # fsGroup matches the image's fixed non-root atuin user (uid/gid 1000), so it can write to the Longhorn-mounted /config volume
      securityContext:
        fsGroup: 1000
      containers:
        - args:
            - start
          envFrom:
            - secretRef:
                name: atuin-secret
          image: ghcr.io/atuinsh/atuin:18.22.0
          name: atuin
          ports:
            - containerPort: 8888
          resources:
            limits:
              cpu: 250m
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 1Gi
          volumeMounts:
            - mountPath: /config
              name: atuin-claim
      volumes:
        - name: atuin-claim
          persistentVolumeClaim:
            claimName: atuin-claim
