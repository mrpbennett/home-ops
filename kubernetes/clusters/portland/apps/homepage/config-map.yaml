  docker.yaml: ""

  custom.css: |
    /* 70LD Cloud / portland: a Google Cloud console look-alike.
       Material-ish tokens, white cards on a pale canvas, blue accent, and
       product-section headers like the console navigation menu.
       Light is the default; the html.dark block below swaps the tokens.
       The data-name selectors must match the names in services.yaml. */

    :root {
      --gc-bg: #f8f9fa;
      --gc-surface: #ffffff;
      --gc-border: #dadce0;
      --gc-text: #202124;
      --gc-text-2: #5f6368;
      --gc-blue: #1a73e8;
      --gc-blue-bg: #e8f0fe;
      --gc-good: #1e8e3e;
      --gc-good-bg: #e6f4ea;
      --gc-warn-bg: #fef7e0;
      --gc-danger-bg: #fce8e6;
      --gc-shadow: 0 1px 2px rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
      --gc-font: "Google Sans", "Google Sans Text", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html.dark {
      --gc-bg: #202124;
      --gc-surface: #292a2d;
      --gc-border: #3c4043;
      --gc-text: #e8eaed;
      --gc-text-2: #9aa0a6;
      --gc-blue: #8ab4f8;
      --gc-blue-bg: rgba(138, 180, 248, 0.16);
      --gc-good: #81c995;
      --gc-good-bg: rgba(129, 201, 149, 0.14);
      --gc-warn-bg: rgba(253, 214, 99, 0.14);
      --gc-danger-bg: rgba(242, 139, 130, 0.16);
      --gc-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    html,
    body,
    #page_wrapper,
    #inner_wrapper {
      background: var(--gc-bg) !important;
      color: var(--gc-text);
      font-family: var(--gc-font) !important;
      font-variant-numeric: tabular-nums;
    }

    /* ---- header bar ------------------------------------------------- */
    #information-widgets {
      background: var(--gc-surface);
      border: 1px solid var(--gc-border);
      border-radius: 8px;
      box-shadow: var(--gc-shadow);
      margin-top: 0.75rem;
      padding: 0.5rem 1rem;
    }

    #information-widgets,
    #information-widgets * {
      color: var(--gc-text) !important;
    }

    .information-widget-greeting span {
      color: var(--gc-blue) !important;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    /* ---- tabs (Dashboard / Products) -------------------------------- */
    [role="tab"] {
      color: var(--gc-text-2) !important;
      background: transparent !important;
      border: 0 !important;
      border-bottom: 3px solid transparent !important;
      border-radius: 0 !important;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.6rem 1.25rem;
    }

    [role="tab"][aria-selected="true"],
    [role="tab"][data-selected] {
      color: var(--gc-blue) !important;
      border-bottom-color: var(--gc-blue) !important;
    }

    [role="tablist"] {
      border-bottom: 1px solid var(--gc-border);
    }

    /* ---- product sections (service / bookmark groups) --------------- */
    .service-group-name,
    .bookmark-group-name {
      color: var(--gc-text) !important;
      font-size: 0.95rem !important;
      font-weight: 500;
      letter-spacing: 0;
    }

    .service-group-icon,
    .bookmark-group-icon {
      color: var(--gc-blue) !important;
      opacity: 1;
    }

    /* ---- cards ------------------------------------------------------ */
    .service-card,
    .bookmark > a,
    .bookmark > div {
      background: var(--gc-surface) !important;
      border: 1px solid var(--gc-border);
      border-radius: 8px !important;
      box-shadow: none !important;
      color: var(--gc-text);
      transition: box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .service-card:hover,
    .bookmark > a:hover {
      border-color: transparent;
      box-shadow: var(--gc-shadow) !important;
    }

    .service-name,
    .bookmark-name {
      color: var(--gc-text) !important;
      font-weight: 500;
    }

    .service-description,
    .bookmark-description {
      color: var(--gc-text-2) !important;
      font-size: 0.72rem !important;
    }

    /* ---- stat blocks (widgets) -------------------------------------- */
    .service-block {
      background: var(--gc-bg) !important;
      border-radius: 6px !important;
    }

    .service-block-value {
      color: var(--gc-text) !important;
      font-weight: 500 !important;
    }

    .service-block-label {
      color: var(--gc-text-2) !important;
      font-size: 0.6rem !important;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    /* Threshold colours from `highlight:` rules in services.yaml */
    .service-block[data-highlight-level="danger"] {
      background: var(--gc-danger-bg) !important;
    }
    .service-block[data-highlight-level="warn"] {
      background: var(--gc-warn-bg) !important;
    }
    .service-block[data-highlight-level="good"] {
      background: var(--gc-good-bg) !important;
    }
    .service-block[data-highlight-level="good"] .service-block-value {
      color: var(--gc-good) !important;
    }

    /* Bigger numbers on the Monitoring tiles */
    li.service:is(
        [data-name="Workloads"],
        [data-name="Alerts & Sync"],
        [data-name="Capacity"],
        [data-name="Storage & Certs"]
      ) .service-block-value {
      font-size: 1.25rem !important;
    }

    @media (max-width: 640px) {
      .service-block-value {
        font-size: 0.95rem !important;
      }
    }
