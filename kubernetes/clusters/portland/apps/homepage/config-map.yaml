---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    ingress: true
    gateway: true

  settings.yaml: |
    title: 70LD // portland
    theme: dark
    color: slate
    headerStyle: clean
    statusStyle: dot
    useEqualHeights: true
    fullWidth: true
    hideVersion: true
    target: _blank

    # Type anywhere to search every service (name + description).
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true

    # Credentials for the Longhorn info widget (API is open in-cluster).
    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local

    # Tabs: Overview is the glance page; everything else is one click away.
    layout:
      Cluster Pulse:
        tab: Overview
        icon: mdi-heart-pulse
        style: row
        columns: 4

      Needs Attention:
        tab: Overview
        icon: mdi-alert-circle-outline
        style: row
        columns: 3

      Shortcuts:
        tab: Overview
        icon: mdi-link-variant
        style: row
        columns: 5

      Platform:
        tab: Services
        icon: mdi-kubernetes
        style: row
        columns: 4

      Observability:
        tab: Services
        icon: mdi-chart-line
        style: row
        columns: 5

      Security:
        tab: Services
        icon: mdi-shield-lock
        style: row
        columns: 2

      Data:
        tab: Services
        icon: mdi-database
        style: row
        columns: 3

      Storage:
        tab: Services
        icon: mdi-harddisk
        style: row
        columns: 4

      Nodes:
        tab: Overview
        icon: mdi-server
        style: row
        columns: 3

      Infra:
        tab: Services
        icon: mdi-lan
        style: row
        columns: 2

  custom.js: ""

  bookmarks.yaml: |
    - Shortcuts:
        - home-ops:
            - icon: github.png
              href: https://github.com/mrpbennett/home-ops
              description: GitOps repo
        - Pull Requests:
            - icon: mdi-source-pull
              href: https://github.com/mrpbennett/home-ops/pulls
              description: Renovate & changes
        - CI:
            - icon: mdi-play-circle-outline
              href: https://github.com/mrpbennett/home-ops/actions
              description: yamlfmt + kubescape
        - Explore Logs:
            - icon: grafana.png
              href: https://grafana.70ld.dev/explore
              description: Loki in Grafana
        - Talos Docs:
            - icon: talos.png
              href: https://www.talos.dev/docs/
              description: Node OS reference

  services.yaml: |
    # ---------------------------------------------------------------------
    # OVERVIEW
    # ---------------------------------------------------------------------
    # Stat tiles: no link, just live Prometheus numbers. Colours come from the
    # `highlight` rules (danger / good) and are styled in custom.css.
    - Cluster Pulse:
        - Workloads:
            icon: mdi-kubernetes
            description: Pods & deployments
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: Running
                  query: 'sum(kube_pod_status_phase{phase="Running"})'
                  format: { type: number }
                - label: Unhealthy
                  query: 'sum(kube_pod_status_phase{phase=~"Pending|Failed|Unknown"}) or vector(0)'
                  format: { type: number }
                - label: Restarts 1h
                  query: 'sum(increase(kube_pod_container_status_restarts_total[1h])) or vector(0)'
                  format: { type: number, options: { maximumFractionDigits: 0 } }
                - label: Unavailable
                  query: 'sum(kube_deployment_status_replicas_unavailable) or vector(0)'
                  format: { type: number }
              highlight:
                Unhealthy:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }
                Unavailable:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }

        - Alerts & Sync:
            icon: mdi-bell-ring-outline
            description: Alertmanager & Argo CD
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: Critical
                  query: 'count(ALERTS{alertstate="firing",severity="critical"}) or vector(0)'
                  format: { type: number }
                - label: Warning
                  query: 'count(ALERTS{alertstate="firing",severity="warning"}) or vector(0)'
                  format: { type: number }
                - label: Out of sync
                  query: 'count(argocd_app_info{sync_status!="Synced"}) or vector(0)'
                  format: { type: number }
                - label: Degraded
                  query: 'count(argocd_app_info{health_status!="Healthy"}) or vector(0)'
                  format: { type: number }
              highlight:
                Critical:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }
                Warning:
                  numeric:
                    - { level: warn, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }
                Out of sync:
                  numeric:
                    - { level: warn, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }
                Degraded:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }

        - Capacity:
            icon: mdi-gauge
            description: Cluster-wide, 3 nodes
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: CPU
                  query: '1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Memory
                  query: 'sum(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Pod slots
                  query: 'sum(kube_pod_info) / sum(kube_node_status_allocatable{resource="pods"})'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Net in
                  query: 'sum(rate(node_network_receive_bytes_total{device=~"en.*|eth.*"}[5m]))'
                  format: { type: byterate }
              highlight:
                CPU:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Memory:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Pod slots:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }

        - Storage & Certs:
            icon: mdi-harddisk
            description: Longhorn & cert-manager
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Longhorn used
                  query: 'sum(longhorn_disk_usage_bytes) / sum(longhorn_disk_capacity_bytes)'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Degraded vols
                  query: 'count(longhorn_volume_robustness >= 2) or vector(0)'
                  format: { type: number }
                - label: Cert expiry
                  query: 'min((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)'
                  format: { type: number, suffix: "d", options: { maximumFractionDigits: 0 } }
                - label: Certs not ready
                  query: 'sum(certmanager_certificate_ready_status{condition="False"}) or vector(0)'
                  format: { type: number }
              highlight:
                Longhorn used:
                  numeric:
                    - { level: danger, when: gte, value: 80 }
                    - { level: good, when: lt, value: 80 }
                Degraded vols:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }
                Cert expiry:
                  numeric:
                    - { level: danger, when: lt, value: 14 }
                    - { level: good, when: gte, value: 14 }
                Certs not ready:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }

    # "Needs Attention" is the log/alert glance: what is firing, and which
    # namespaces / pods emitted the most error|fatal|panic lines in the last
    # 15 minutes (queried straight from Loki, no extra components).
    - Needs Attention:
        - Active Alerts:
            icon: mdi-bell-alert-outline
            href: https://alertmanager.70ld.dev
            description: Firing now, excluding Watchdog
            widgets:
              - type: customapi
                url: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts?active=true\
                  &silenced=false&inhibited=false&filter=alertname%21~%22Watchdog%7CInfoInhibitor%22"
                refreshInterval: 30000
                display: block
                mappings:
                  - label: Firing
                    format: size
              - type: customapi
                url: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts?active=true\
                  &silenced=false&inhibited=false&filter=alertname%21~%22Watchdog%7CInfoInhibitor%22"
                refreshInterval: 30000
                display: dynamic-list
                mappings:
                  name: labels.alertname
                  label: labels.severity
                  limit: 5

        - Errors by Namespace:
            icon: mdi-text-box-search-outline
            href: https://grafana.70ld.dev/explore
            description: error|fatal|panic lines, last 15m
            widgets:
              - type: customapi
                url: "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/query?query=sum%28count_over_time%28%7Bnamespace\
                  %3D~%22.%2B%22%7D%20%7C~%20%22%28%3Fi%29%28error%7Cfatal%7Cpanic%29%22%20%5B15m%5D%29%29%20or%20vector\
                  %280%29"
                refreshInterval: 60000
                display: block
                mappings:
                  - field: data.result.0.value.1
                    label: Total lines
                    format: number
              - type: customapi
                url: "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/query?query=topk%285%2C%20sum%20by%20%28namespace\
                  %29%28count_over_time%28%7Bnamespace%3D~%22.%2B%22%7D%20%7C~%20%22%28%3Fi%29%28error%7Cfatal%7Cpanic\
                  %29%22%20%5B15m%5D%29%29%29"
                refreshInterval: 60000
                display: dynamic-list
                mappings:
                  items: data.result
                  name: metric.namespace
                  label: value.1
                  format: number
                  limit: 5

        - Errors by Pod:
            icon: mdi-bug-outline
            href: https://grafana.70ld.dev/explore
            description: Noisiest pods, last 15m
            widget:
              type: customapi
              url: "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/query?query=topk%285%2C%20sum%20by%20%28pod\
                %29%28count_over_time%28%7Bnamespace%3D~%22.%2B%22%7D%20%7C~%20%22%28%3Fi%29%28error%7Cfatal%7Cpanic\
                %29%22%20%5B15m%5D%29%29%29"
              refreshInterval: 60000
              display: dynamic-list
              mappings:
                items: data.result
                name: metric.pod
                label: value.1
                format: number
                limit: 5

    # ---------------------------------------------------------------------
    # INFRA
    # ---------------------------------------------------------------------
    - Nodes:
        - kube-cp-1:
            icon: mdi-server
            description: 192.168.7.1 · control-plane
            ping: 192.168.7.1
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: CPU
                  query: '1 - avg(rate(node_cpu_seconds_total{mode="idle",instance="192.168.7.1:9100"}[5m]))'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Memory
                  query: '1 - node_memory_MemAvailable_bytes{instance="192.168.7.1:9100"} / node_memory_MemTotal_bytes{instance="192.168.7.1:9100"}'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Temp
                  query: 'max(node_hwmon_temp_celsius{instance="192.168.7.1:9100"})'
                  format: { type: number, suffix: "°C", options: { maximumFractionDigits: 0 } }
                - label: Net in
                  query: 'sum(rate(node_network_receive_bytes_total{device=~"en.*|eth.*",instance="192.168.7.1:9100"}[5m]))'
                  format: { type: byterate }
              highlight:
                CPU:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Memory:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Temp:
                  numeric:
                    - { level: danger, when: gte, value: 80 }
                    - { level: good, when: lt, value: 80 }

        - kube-cp-2:
            icon: mdi-server
            description: 192.168.7.2 · control-plane
            ping: 192.168.7.2
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: CPU
                  query: '1 - avg(rate(node_cpu_seconds_total{mode="idle",instance="192.168.7.2:9100"}[5m]))'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Memory
                  query: '1 - node_memory_MemAvailable_bytes{instance="192.168.7.2:9100"} / node_memory_MemTotal_bytes{instance="192.168.7.2:9100"}'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Temp
                  query: 'max(node_hwmon_temp_celsius{instance="192.168.7.2:9100"})'
                  format: { type: number, suffix: "°C", options: { maximumFractionDigits: 0 } }
                - label: Net in
                  query: 'sum(rate(node_network_receive_bytes_total{device=~"en.*|eth.*",instance="192.168.7.2:9100"}[5m]))'
                  format: { type: byterate }
              highlight:
                CPU:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Memory:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Temp:
                  numeric:
                    - { level: danger, when: gte, value: 80 }
                    - { level: good, when: lt, value: 80 }

        - kube-cp-3:
            icon: mdi-server
            description: 192.168.7.3 · control-plane
            ping: 192.168.7.3
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: CPU
                  query: '1 - avg(rate(node_cpu_seconds_total{mode="idle",instance="192.168.7.3:9100"}[5m]))'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Memory
                  query: '1 - node_memory_MemAvailable_bytes{instance="192.168.7.3:9100"} / node_memory_MemTotal_bytes{instance="192.168.7.3:9100"}'
                  format: { type: number, scale: 100, suffix: "%", options: { maximumFractionDigits: 0 } }
                - label: Temp
                  query: 'max(node_hwmon_temp_celsius{instance="192.168.7.3:9100"})'
                  format: { type: number, suffix: "°C", options: { maximumFractionDigits: 0 } }
                - label: Net in
                  query: 'sum(rate(node_network_receive_bytes_total{device=~"en.*|eth.*",instance="192.168.7.3:9100"}[5m]))'
                  format: { type: byterate }
              highlight:
                CPU:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Memory:
                  numeric:
                    - { level: danger, when: gte, value: 85 }
                    - { level: good, when: lt, value: 85 }
                Temp:
                  numeric:
                    - { level: danger, when: gte, value: 80 }
                    - { level: good, when: lt, value: 80 }

    # ---------------------------------------------------------------------
    # PLATFORM
    # `namespace` + blank `podSelector` adds the pod-health dot (click it for
    # CPU / memory); `siteMonitor` hits the in-cluster Service directly so the
    # dot reflects the app, not DNS or the gateway.
    # ---------------------------------------------------------------------
    - Platform:
        - ArgoCD:
            icon: argo-cd.png
            href: https://argocd.70ld.dev
            description: Continuous Delivery
            siteMonitor: https://argocd.70ld.dev
            namespace: argocd
            app: argocd
            podSelector: ""
            widget:
              type: argocd
              url: https://argocd.70ld.dev
              key: "{{HOMEPAGE_VAR_ARGOCD_KEY}}"

        - Gitea:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/gitea.svg
            href: https://git.70ld.dev/
            description: Version control
            siteMonitor: http://gitea-http.gitea.svc.cluster.local:3000/api/healthz
            namespace: gitea
            app: gitea
            podSelector: ""

        - Registry:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/docker.svg
            href: https://registry.70ld.dev/v2/_catalog
            description: Image registry
            siteMonitor: http://docker-registry-svc.docker-registry.svc.cluster.local:5000/v2/
            namespace: docker-registry
            app: docker-registry
            podSelector: ""
            widget:
              type: customapi
              url: http://docker-registry-svc.docker-registry.svc.cluster.local:5000/v2/_catalog
              refreshInterval: 60000
              mappings:
                - field: repositories
                  label: Repositories
                  format: size

        - NanoClaw:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nanoclaw.svg
            href: https://portal.nanoclaw.dev/
            description: Cluster agent

        # Airflow is not deployed in the cluster right now (no namespace, no
        # Argo app). Restore this when it comes back.
        # - Airflow:
        #     icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/apache-airflow.svg
        #     href: https://airflow.70ld.dev
        #     description: Workflow Management Platform

    - Observability:
        - Grafana:
            icon: grafana.png
            href: https://grafana.70ld.dev/dashboards?starred
            description: Dashboards
            siteMonitor: http://kube-prometheus-stack-grafana.monitoring.svc.cluster.local/api/health
            namespace: monitoring
            app: grafana
            podSelector: app.kubernetes.io/name=grafana

        - Prometheus:
            icon: prometheus.png
            href: http://prometheus.70ld.dev
            description: Metrics
            siteMonitor: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy
            namespace: monitoring
            app: prometheus
            podSelector: app.kubernetes.io/name=prometheus
            widget:
              type: prometheus
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

        - AlertManager:
            icon: alertmanager.png
            href: https://alertmanager.70ld.dev
            description: Alert routing
            siteMonitor: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/-/healthy
            namespace: monitoring
            app: alertmanager
            podSelector: app.kubernetes.io/name=alertmanager

        - Loki:
            icon: loki.png
            href: https://grafana.70ld.dev/explore
            description: Logs (Loki + Alloy)
            namespace: logging
            app: loki
            podSelector: ""
            widget:
              type: customapi
              url: "http://loki-gateway.logging.svc.cluster.local/loki/api/v1/label/namespace/values"
              refreshInterval: 120000
              mappings:
                - field: data
                  label: Namespaces logging
                  format: size

        - Headlamp:
            icon: headlamp.png
            href: https://headlamp.70ld.dev
            description: Cluster UI
            siteMonitor: http://headlamp.headlamp.svc.cluster.local
            namespace: headlamp
            app: headlamp
            podSelector: ""

    - Security:
        - Keycloak:
            icon: keycloak.png
            href: https://keycloak.70ld.dev
            description: Auth & OIDC
            siteMonitor: http://keycloak.keycloak.svc.cluster.local:8080/realms/master
            namespace: keycloak
            app: keycloak
            podSelector: ""

        - Vault:
            icon: vault-light.png
            href: http://vault.70ld.dev
            description: Secret Management
            siteMonitor: http://vault.vault.svc.cluster.local:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
            namespace: vault
            app: vault
            podSelector: ""
            widget:
              type: customapi
              url: http://vault.vault.svc.cluster.local:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200
              refreshInterval: 30000
              mappings:
                - field: sealed
                  label: Sealed
                  format: text
                - field: initialized
                  label: Initialized
                  format: text
                - field: version
                  label: Version
                  format: text

    # ---------------------------------------------------------------------
    # DATA & STORAGE
    # ---------------------------------------------------------------------
    - Data:
        - ChartDB:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/chartdb.png
            href: https://chartdb.70ld.dev
            description: Self hosted ERD
            siteMonitor: http://chartdb.chartdb.svc.cluster.local
            namespace: chartdb
            app: chartdb
            podSelector: ""

        - PGAdmin:
            icon: postgres.png
            href: https://pgadmin.70ld.dev
            description: Postgres · cnpg-prod-cluster
            siteMonitor: http://pgadmin-service.pgadmin.svc.cluster.local:5050/misc/ping
            namespace: pgadmin
            app: pgadmin
            podSelector: ""
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 30000
              metrics:
                - label: Instances up
                  query: 'sum(cnpg_collector_up) or vector(0)'
                  format: { type: number }
                - label: Connections
                  query: 'sum(cnpg_backends_total) or vector(0)'
                  format: { type: number }
                - label: Max lag
                  query: 'max(cnpg_pg_replication_lag) or vector(0)'
                  format: { type: number, suffix: "s", options: { maximumFractionDigits: 1 } }
                - label: DB size
                  query: 'sum(cnpg_pg_database_size_bytes)'
                  format: { type: bytes }
              highlight:
                Instances up:
                  numeric:
                    - { level: danger, when: lt, value: 3 }
                    - { level: good, when: gte, value: 3 }
                Max lag:
                  numeric:
                    - { level: danger, when: gte, value: 30 }
                    - { level: good, when: lt, value: 30 }

        - Trino:
            icon: https://cdn.simpleicons.org/trino/FFFFFF
            href: http://trino.70ld.dev
            description: SQL Query Engine
            siteMonitor: http://trino.trino.svc.cluster.local:8080/v1/info
            namespace: trino
            app: trino
            podSelector: ""

    - Storage:
        - Longhorn:
            icon: longhorn.png
            href: https://longhorn.70ld.dev
            description: Persistent Block Storage
            siteMonitor: http://longhorn-frontend.longhorn-system.svc.cluster.local
            namespace: longhorn-system
            app: longhorn
            podSelector: ""
            widget:
              type: prometheusmetric
              url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              refreshInterval: 60000
              metrics:
                - label: Healthy vols
                  query: 'count(longhorn_volume_robustness == 1) or vector(0)'
                  format: { type: number }
                - label: Degraded
                  query: 'count(longhorn_volume_robustness >= 2) or vector(0)'
                  format: { type: number }
                - label: Used
                  query: 'sum(longhorn_disk_usage_bytes)'
                  format: { type: bytes }
                - label: Capacity
                  query: 'sum(longhorn_disk_capacity_bytes)'
                  format: { type: bytes }
              highlight:
                Degraded:
                  numeric:
                    - { level: danger, when: gte, value: 1 }
                    - { level: good, when: eq, value: 0 }

        - SeaweedFS:
            icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/seaweedfs.svg
            href: http://192.168.6.2:23646/admin
            description: Object Storage
            siteMonitor: http://192.168.6.2:23646/admin

        - TrueNAS Scale:
            icon: truenas-scale.svg
            href: http://192.168.4.50
            description: Actually WD Cloud
            ping: 192.168.4.50

        - WDCloud:
            icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/western-digital.svg
            href: http://192.168.4.110
            description: WD Cloud
            ping: 192.168.4.110

    - Infra:
        - AdGuard Home:
            icon: adguard-home.png
            href: https://dns.70ld.dev
            description: Primary DNS
            widget:
              type: adguard
              url: https://dns.70ld.dev
              username: "{{HOMEPAGE_VAR_ADGUARD_USERNAME}}"
              password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
              fields: ["queries", "blocked", "filtered", "latency"]

  widgets.yaml: |
    - greeting:
        text_size: 3xl
        text: portland // 70ld.dev

    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "portland"
        nodes:
          show: false

    - longhorn:
        expanded: false
        total: true
        labels: true

    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: medium
          hourCycle: h23

  docker.yaml: ""

  custom.css: |
    /* 70LD homelab / portland: flat and minimal.
       The data-name selectors below must match the names in services.yaml. */

    html,
    body {
      font-variant-numeric: tabular-nums;
    }

    /* ---- groups ------------------------------------------------------ */
    .service-group-name,
    .bookmark-group-name {
      font-size: 0.8rem !important;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ---- cards ------------------------------------------------------- */
    .service-card {
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px !important;
      box-shadow: none !important;
    }

    .service-description {
      font-size: 0.72rem !important;
    }

    /* ---- stat blocks (widgets) --------------------------------------- */
    .service-block {
      border-radius: 6px !important;
    }

    .service-block-value {
      font-weight: 600 !important;
    }

    .service-block-label {
      font-size: 0.6rem !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
    }

    /* Threshold colours from `highlight:` rules in services.yaml */
    .service-block[data-highlight-level="danger"] {
      background: rgba(248, 113, 113, 0.18) !important;
    }
    .service-block[data-highlight-level="warn"] {
      background: rgba(251, 191, 36, 0.16) !important;
    }
    .service-block[data-highlight-level="good"] .service-block-value {
      color: #86efac;
    }

    /* Bigger numbers on the Cluster Pulse tiles */
    li.service:is(
        [data-name="Workloads"],
        [data-name="Alerts & Sync"],
        [data-name="Capacity"],
        [data-name="Storage & Certs"]
      ) .service-block-value {
      font-size: 1.25rem !important;
    }

    @media (max-width: 640px) {
      .service-block-value {
        font-size: 0.95rem !important;
      }
    }
