---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    kubevirt.io/vm: &vm_name dor1-kv-ubuntu
  name: *vm_name
  namespace: kubevirt-vms
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: dor1-kv-ubuntu-rootdisk
      spec:
        source:
          registry:
            url: docker://quay.io/containerdisks/ubuntu:24.04
        storage:
          storageClassName: longhorn-kubevirt
          accessModes:
            - ReadWriteMany
          volumeMode: Block
          resources:
            requests:
              storage: 20Gi
  template:
    metadata:
      labels:
        kubevirt.io/vm: *vm_name
    spec:
      # TODO: uncomment the hostname selector when kube-wk-1 is up.
      # Run VM on kube-wk-1
      # nodeSelector:
      #   kubernetes.io/hostname: dor1-k8s-compute-01
      domain:
        cpu:
          cores: 1
        devices:
          disks:
            - disk:
                bus: virtio
              name: rootdisk
              bootOrder: 1
            - disk:
                bus: virtio
              name: cloudinitdisk
          interfaces:
            - name: default
              masquerade: {}
              # pinned: the guest's /etc/netplan/50-cloud-init.yaml matches the NIC by MAC,
              # and KubeVirt otherwise assigns a new random MAC on every VMI restart
              macAddress: "f2:68:cb:8d:e5:fc"
        machine:
          type: q35
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      terminationGracePeriodSeconds: 30
      volumes:
        - name: rootdisk
          dataVolume:
            name: dor1-kv-ubuntu-rootdisk
        - name: cloudinitdisk
          cloudInitNoCloud:
            userData: |
              #cloud-config
              users:
                - name: sysadm
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
                  lock_passwd: false
              chpasswd:
                list: |
                  sysadm:ubuntu
                expire: false
              ssh_pwauth: true
---
apiVersion: v1
kind: Service
metadata:
  name: dor1-kv-ubuntu-ssh
  namespace: kubevirt-vms
  annotations:
    metallb.io/loadBalancerIPs: 192.168.7.17
    external-dns.alpha.kubernetes.io/hostname: dor1-kv-ubuntu.70ld.dev
spec:
  type: LoadBalancer
  selector:
    kubevirt.io/vm: dor1-kv-ubuntu
  ports:
    - port: 22
      targetPort: 22
      protocol: TCP
