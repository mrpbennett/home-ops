---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: longhorn-alerts
  namespace: monitoring
spec:
  groups:
    - name: longhorn
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness{state="degraded"} == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn volume {{ $labels.pvc }} is degraded"
            description: "Volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been degraded for 30 minutes (replica rebuild
              not finishing?)."

        - alert: LonghornVolumeFaulted
          expr: longhorn_volume_robustness{state="faulted"} == 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.pvc }} is faulted"
            description: "Volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no healthy replicas."

        - alert: LonghornNodeNotReady
          expr: longhorn_node_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn node {{ $labels.node }} is not ready"
            description: "Longhorn reports node {{ $labels.node }} as not ready for 5 minutes."

        - alert: LonghornDiskNotReady
          expr: longhorn_disk_status{condition="ready"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn disk on {{ $labels.node }} is not ready"
            description: "Disk {{ $labels.disk }} on node {{ $labels.node }} is not ready."

        # longhorn_backup_state: 0=New 1=Pending 2=InProgress 3=Completed 4=Error 5=Unknown.
        # There is no last-success timestamp metric, so this catches failed backups but not a job that stopped running.
        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup {{ $labels.backup }} failed"
            description: "Backup {{ $labels.backup }} of volume {{ $labels.volume }} is in the Error state. Check the backup
              target (NAS) is reachable."

        - alert: LonghornDiskUsageHigh
          expr: longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn disk on {{ $labels.node }} is over 80% full"
            description: "Disk {{ $labels.disk }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full."

        - alert: LonghornDiskUsageCritical
          expr: longhorn_disk_usage_bytes / longhorn_disk_capacity_bytes > 0.9
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn disk on {{ $labels.node }} is over 90% full"
            description: "Disk {{ $labels.disk }} on {{ $labels.node }} is {{ $value | humanizePercentage }} full."
