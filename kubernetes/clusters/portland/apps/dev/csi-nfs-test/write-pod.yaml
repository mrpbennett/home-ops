---
apiVersion: v1
kind: Pod
metadata:
  name: dev-write-pod
  namespace: dev
spec:
  volumes:
    - name: dev-pvc-test
      persistentVolumeClaim:
        claimName: dev-test-nfs
  containers:
    - name: dev-test-nfs
      image: busybox
      command:
        - sh
        - -c
        - date >> /data/out.txt && cat /data/out.txt && sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
      volumeMounts:
        - mountPath: /data
          name: dev-pvc-test
