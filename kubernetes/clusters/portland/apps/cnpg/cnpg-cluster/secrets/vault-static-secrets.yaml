apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudnativepg-prod-main-user
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: cloudnativepg/cnpg-cluster-user
  refreshAfter: 60s
  destination:
    name: cnpg-cluster-user
    create: true

