---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: pgadmin-credentials
  namespace: pgadmin
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: pgadmin/config
  refreshAfter: 60s
  destination:
    name: pgadmin-credentials
    create: true
