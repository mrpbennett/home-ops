
---
# Raw secret: S3 credentials are read by key name via external_secrets.storage
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: &name plane-vault-secret
  namespace: plane
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: plane/config
  refreshAfter: 60s
  destination:
    name: *name
    create: true
---
# Keys in the shape the plane-ce chart expects for app_env_existingSecret / app_keys_existingSecret.
# Providing app_env_existingSecret replaces the chart's own app-secrets, so REDIS_URL and
# AMQP_URL (local redis / rabbitmq) must be here too.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: &app_env plane-app-env
  namespace: plane
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: plane/config
  refreshAfter: 60s
  destination:
    name: *app_env
    create: true
    transformation:
      excludeRaw: true
      templates:
        DATABASE_URL:
          text: 'postgresql://{{ get .Secrets "db_user" | urlquery }}:{{ get .Secrets "db_password" | urlquery }}@cnpg-prod-cluster-rw.cnpg-prod-cluster.svc.cluster.local:5432/plane'
        REDIS_URL:
          text: "redis://plane-redis.plane.svc.cluster.local:6379/"
        AMQP_URL:
          text: "amqp://plane:plane@plane-rabbitmq.plane.svc.cluster.local/"
        SECRET_KEY:
          text: '{{ get .Secrets "secret_key" }}'
        LIVE_SERVER_SECRET_KEY:
          text: '{{ get .Secrets "live_server_secret_key" }}'
---
# Password for the `plane` role managed by cnpg-prod-cluster (managed.roles[].passwordSecret).
# Must live in the cluster's namespace and carry username/password keys.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: &cnpg cnpg-plane-db
  namespace: cnpg-prod-cluster
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: plane/config
  refreshAfter: 60s
  destination:
    name: *cnpg
    create: true
    type: kubernetes.io/basic-auth
    labels:
      cnpg.io/reload: "true"
    transformation:
      excludeRaw: true
      templates:
        username:
          text: '{{ get .Secrets "db_user" }}'
        password:
          text: '{{ get .Secrets "db_password" }}'
