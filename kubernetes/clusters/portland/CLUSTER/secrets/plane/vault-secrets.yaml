
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: &name plane-vault-secret
  namespace: plane
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: plane/config
  refreshAfter: 60s
  destination:
    name: *name
    create: true
