---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: external-dns-adguard-secret
  namespace: external-dns
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: external-dns/adguard
  refreshAfter: 60s
  destination:
    name: adguard-configuration
    create: true
