---
# DB credentials for the gitea role in cnpg-prod-cluster. Same Vault path as the
# cnpg-gitea-db Secret in the cnpg-prod-cluster namespace; copied here so the
# gitea pod can read it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitea-db
  namespace: gitea
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: cloudnativepg/gitea-db
  refreshAfter: 60s
  destination:
    name: gitea-db
    create: true
---
# Gitea admin account. Keys: username, password, email
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitea-admin
  namespace: gitea
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: gitea/admin
  refreshAfter: 60s
  destination:
    name: gitea-admin
    create: true
---
# Keycloak OIDC client credentials. Keys: key (client id), secret (client secret)
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gitea-oauth
  namespace: gitea
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: gitea/oauth
  refreshAfter: 60s
  destination:
    name: gitea-oauth
    create: true
