
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: &name seaweedfs-admin
  namespace: seaweedfs
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: seaweedfs/admin
  refreshAfter: 60s
  destination:
    name: *name
    create: true
