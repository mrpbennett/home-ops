---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: gatus-discord-webhook
  namespace: gatus
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: gatus/discord
  refreshAfter: 60s
  destination:
    name: gatus-discord-webhook
    create: true
