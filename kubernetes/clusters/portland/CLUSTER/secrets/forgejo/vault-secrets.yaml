---
# DB credentials for the forgejo role in cnpg-prod-cluster. Same Vault path as the
# cnpg-forgejo-db Secret in the cnpg-prod-cluster namespace; copied here so the
# forgejo pod can read it.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-db
  namespace: forgejo
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: cloudnativepg/forgejo-db
  refreshAfter: 60s
  destination:
    name: forgejo-db
    create: true
---
# Forgejo admin account. Keys: username, password, email
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: forgejo-admin
  namespace: forgejo
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: forgejo/admin
  refreshAfter: 60s
  destination:
    name: forgejo-admin
    create: true
