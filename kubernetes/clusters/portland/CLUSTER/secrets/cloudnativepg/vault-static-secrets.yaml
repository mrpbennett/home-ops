---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudnativepg-prod-main-user
  namespace: cnpg-prod-cluster
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: cloudnativepg/cnpg-cluster-user
  refreshAfter: 60s
  destination:
    name: cnpg-cluster-user
    create: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudnativepg-keycloak
  namespace: cnpg-prod-cluster
spec:
  vaultAuthRef: vault-auth
  mount: kv
  type: kv-v2
  path: cloudnativepg/keycloak-db
  refreshAfter: 60s
  destination:
    name: cnpg-keycloak-db
    create: true

---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudnativepg-backup-secret
  namespace: cnpg-prod-cluster
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: cloudnativepg/backup
  refreshAfter: 60s
  destination:
    name: cloudnativepg-backup-secret
    create: true
