---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: alertmanager/discord
  refreshAfter: 60s
  destination:
    name: alertmanager-discord
    create: true
