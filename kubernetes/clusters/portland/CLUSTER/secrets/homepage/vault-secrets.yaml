---
# Credentials for Homepage widgets (AdGuard, Argo CD). Keys are already named
# HOMEPAGE_VAR_*, so the pod consumes the whole Secret with envFrom and the
# config references them as {{HOMEPAGE_VAR_*}}.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  vaultAuthRef: vault-secrets-operator/vault-auth
  mount: kv
  type: kv-v2
  path: homepage
  refreshAfter: 60s
  destination:
    name: homepage-secrets
    create: true
