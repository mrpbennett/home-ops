---
- apiVersion: secrets.hashicorp.com/v1beta1
  kind: VaultStaticSecret
  metadata:
    name: operator-oauth
    namespace: tailscale
  spec:
    vaultAuthRef: vault-secrets-operator/vault-auth
    mount: kv
    type: kv-v2
    path: tailscale
    refreshAfter: 60s
    destination:
      name: operator-oauth
      create: true
