---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-tailscale
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seaweedfs-s3
      port:
        number: 8333
  # first label is the tailnet hostname, so this gives s3.<tailnet>
  tls:
    - hosts:
        - s3
