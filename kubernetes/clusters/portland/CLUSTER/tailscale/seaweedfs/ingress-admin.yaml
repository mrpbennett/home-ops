---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seaweedfs-admin-tailscale
  namespace: seaweedfs
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: seaweedfs-admin
      port:
        number: 12535
  # first label is the tailnet hostname, so this gives seaweedfs.<tailnet>
  tls:
    - hosts:
        - seaweedfs
