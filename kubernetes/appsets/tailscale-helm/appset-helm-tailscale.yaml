---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name tailscale
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: tailscale-operator
        repoURL: https://pkgs.tailscale.com/helmcharts
        targetRevision: 1.104.1
        helm:
          valuesObject:
            oauthSecretVolume:
              secret:
                secretName: operator-oauth

            operatorConfig:
              defaultTags:
                - "tag:k8s-operator"

            ingressClass:
              name: tailscale
              enabled: true

            # kubectl access over the tailnet (tailscale configure kubeconfig tailscale-operator)
            apiServerProxyConfig:
              mode: "true"
              allowImpersonation: "true"

      destination:
        name: "{{.cluster}}"
        namespace: *app_name
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
