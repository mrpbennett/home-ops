---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name valkey
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - app_name: *app_name
            project: default
            repo_url: https://github.com/mrpbennett/home-ops.git
            cluster: portland
            clusterURL: 'https://kubernetes.default.svc'
  template:
    metadata:
      name: '{{.app_name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{.project}}'
      source:
        chart: valkey-resources
        repoURL: https://valkey.io/valkey-helm
        targetRevision: 0.4.0
        helm:
          valuesObject:
            fullnameOverride: cache

            metrics:
              podMonitor:
                enabled: true
                labels:
                  release: prometheus

            cluster:
              spec:
                shards: 3
                replicas: 1
                workloadType: StatefulSet
                persistence:
                  size: 10Gi
                  storageClassName: longhorn


      destination:
        name: '{{.cluster}}'
        namespace: '{{.app_name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - Validate=true
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
