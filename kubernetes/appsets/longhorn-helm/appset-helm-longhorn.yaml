---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name longhorn
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: longhorn
        repoURL: https://charts.longhorn.io/
        targetRevision: 1.12.1
        helm:
          valuesObject:
            preUpgradeChecker:
              jobEnabled: false

            persistence:
              defaultClass: true
              defaultFsType: ext4
              defaultClassReplicaCount: 3
              reclaimPolicy: Delete
              volumeBindngMode: "Immediate"
              dataEngine: v1

            defaultSetting:
              storageOverProvisioningPercentage: 200
              storageMinimalAvailablePercentage: 10
              autoCleanupSystemGeneratedSnapshot: true
              orphanResourceAutoDeletion: "replica-data"
              logLevel: "Warn"

            defaultBackupStore:
              backupTarget: "nfs://192.168.4.110:/mnt/HD/HD_a2/longhorn-backups?nfsOptions=nfsvers=3,nolock,soft,timeo=300"
              backupTargetCredentialSecret: longhorn-nfs-backup-secret

            longhornUI:
              replicas: 1

            httproute:
              enabled: true
              parentRefs:
                - name: envoy-shared-gateway
                  namespace: envoy-gateway-system
                  sectionName: https
              hostnames:
                - longhorn.70ld.dev
              path: /
              pathType: PathPrefix
              annotations:
                cert-manager.io/cluster-issuer: "letsencrypt-cloudflare-dns-issuer"

            metrics:
              serviceMonitor:
                enabled: true
                interval: 30s

            extraObjects:
              - apiVersion: v1
                kind: Secret
                metadata:
                  name: longhorn-nfs-backup-secret
                  namespace: longhorn-system
                type: Opaque
                data:
                  username: cGF1bA==
                  password: MTIzcXdlISE=

              - apiVersion: longhorn.io/v1beta2
                kind: RecurringJob
                metadata:
                  name: weekly-system-backup
                  namespace: longhorn-system
                spec:
                  task: system-backup
                  cron: "0 1 * * SUN"
                  retain: 1
                  parameters:
                    volume-backup-policy: if-not-present

              - apiVersion: longhorn.io/v1beta2
                kind: RecurringJob
                metadata:
                  name: daily-snapshot-backup
                  namespace: longhorn-system
                spec:
                  task: snapshot
                  cron: "0 1 * * *"
                  retain: 1
                  concurrency: 2

              # RWX + volumeMode: Block (KubeVirt live migration) requires migratable: "true"
              - apiVersion: storage.k8s.io/v1
                kind: StorageClass
                metadata:
                  name: longhorn-kubevirt
                provisioner: driver.longhorn.io
                allowVolumeExpansion: true
                reclaimPolicy: Delete
                volumeBindingMode: Immediate
                parameters:
                  numberOfReplicas: "3"
                  staleReplicaTimeout: "30"
                  fsType: ext4
                  dataEngine: v1
                  migratable: "true"

      destination:
        name: "{{.cluster}}"
        namespace: longhorn-system
      ignoreDifferences:
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: engineimages.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: engines.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: instancemanagers.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: nodes.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: replicas.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: settings.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
        - group: apiextensions.k8s.io
          kind: CustomResourceDefinition
          name: volumes.longhorn.io
          jsonPointers: ["/spec/preserveUnknownFields"]
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Talos enforces the baseline Pod Security level by default; this app needs host access
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
