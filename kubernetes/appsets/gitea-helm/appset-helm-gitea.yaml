---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name gitea
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: gitea
        repoURL: https://dl.gitea.com/charts
        targetRevision: 12.7.0
        helm:
          valuesObject:
            # NOTE: the chart bundles its own postgres and valkey, both on by default
            # (postgresql-ha, valkey-cluster). We use the cluster's CNPG instead, and
            # with valkey off Gitea falls back to in-memory cache/session + leveldb queue.
            postgresql-ha:
              enabled: false
            postgresql:
              enabled: false
            valkey-cluster:
              enabled: false
            valkey:
              enabled: false

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 768Mi

            service:
              ssh:
                type: LoadBalancer
                port: 22
                # chart default is None (headless), which cannot be a LoadBalancer
                clusterIP: ""
                annotations:
                  metallb.universe.tf/loadBalancerIPs: 192.168.7.16
                  external-dns.alpha.kubernetes.io/hostname: git-ssh.70ld.dev

            gatewayAPI:
              enabled: true
              core:
                httpRoute:
                  enabled: true
                  # upstream gateway terminates TLS, so ROOT_URL becomes https://
                  tls: true
                  parentRefs:
                    - name: envoy-shared-gateway
                      namespace: envoy-gateway-system
                      sectionName: https
                  hostnames:
                    - git.70ld.dev

            gitea:
              admin:
                existingSecret: gitea-admin
                passwordMode: keepUpdated

              # Keycloak SSO. Client secret comes from Vault via the gitea-oauth Secret.
              # The name here is the auth source name and appears in the callback URL:
              # https://git.70ld.dev/user/oauth2/keycloak/callback
              oauth:
                - name: keycloak
                  provider: openidConnect
                  existingSecret: gitea-oauth
                  autoDiscoverUrl: https://keycloak.70ld.dev/realms/master/.well-known/openid-configuration

              # DB password is injected as GITEA__database__PASSWD, never in git
              additionalConfigFromEnvs:
                - name: GITEA__database__PASSWD
                  valueFrom:
                    secretKeyRef:
                      name: gitea-db
                      key: password

              config:
                server:
                  DOMAIN: git.70ld.dev
                  SSH_DOMAIN: git-ssh.70ld.dev
                database:
                  DB_TYPE: postgres
                  HOST: cnpg-prod-cluster-rw.cnpg-prod-cluster.svc.cluster.local:5432
                  NAME: gitea
                  USER: gitea
                # accounts are only created through Keycloak sign-in
                service:
                  DISABLE_REGISTRATION: true
                  ALLOW_ONLY_EXTERNAL_REGISTRATION: true
                oauth2_client:
                  ENABLE_AUTO_REGISTRATION: true

      destination:
        name: "{{.cluster}}"
        namespace: *app_name
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
