---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name gitea
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: gitea
        repoURL: https://dl.gitea.com/charts
        targetRevision: 12.7.0
        helm:
          valuesObject:
            deployment:
              enalbed: true

            dnsConfig:
              nameservers:
                - 192.168.4.2

            gitea:
              envFrom:
                - secretRef:
                    name: gitea-db

              resources:
                limits:
                  cpu: 100m
                  ephemeral: 100Mi
                  memory: 128Mi
                requests:
                  cpu: 100m
                  ephemeral: 100m
                  memory: 128Mi
                config:
                  database:
                    DB_TYPE: postgres
                    HOST: cnpg-prod-cluster-rw.cnpg-prod-cluster.svc.cluster.local:5432
                    NAME: gitea
                    USER: gitea
                    PASSWD: gitea
                    SCHEMA: gitea

              gatewayAPI:
                enalbed: true
                httpRoute:
                  enabled: true
                  parentRefs:
                    - name: envoy-shared-gateway
                      namespace: envoy-gateway-system
                  hostnames:
                    - 'git.70ld.dev'
                  rules:
                    - matches:
                        - path:
                            type: PathPrefix
                            value: /
                      backendRefs:
                        - name: gitea-svc
                          port: 8080

            # NOTE: disabling built in cnpg for clusters own cnpg instance
            cloudnativePG:
              enalbed: false

      destination:
        name: "{{.cluster}}"
        namespace: *app_name
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
