---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name vault
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: vault
        repoURL: https://helm.releases.hashicorp.com
        targetRevision: 0.32.0
        helm:
          valuesObject:
            global:
              enabled: true

            server:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi

              # Re-unseals Vault after restarts. The key lives in the vault-unseal-key
              # Secret, which is created by hand and never committed (see README).
              extraVolumes:
                - type: secret
                  name: vault-unseal-key

              extraContainers:
                - name: unsealer
                  image: hashicorp/vault:1.21.2
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      while true; do
                        if vault status -format=json 2>/dev/null | grep -q '"sealed": true'; then
                          vault operator unseal - < /vault/userconfig/vault-unseal-key/key > /dev/null
                        fi
                        sleep 10
                      done
                  env:
                    - name: VAULT_ADDR
                      value: http://127.0.0.1:8200
                  volumeMounts:
                    - name: userconfig-vault-unseal-key
                      mountPath: /vault/userconfig/vault-unseal-key
                      readOnly: true
                  resources:
                    requests:
                      cpu: 5m
                      memory: 16Mi
                    limits:
                      memory: 64Mi

              ingress:
                enabled: true
                annotations:
                  cert-manager.io/cluster-issuer: "letsencrypt-cloudflare-dns-issuer"
                ingressClassName: nginx
                pathType: Prefix
                hosts:
                  - host: vault.70ld.dev
                tls:
                  - secretName: vault-tls
                    hosts:
                      - vault.70ld.dev

              service:
                type: LoadBalancer
                annotations:
                  metallb.io/loadBalancerIPs: 192.168.7.12

              dataStorage:
                enabled: true
                size: 10Gi
                mountPath: "/vault/data"
                storageClass: longhorn
                accessMode: ReadWriteOnce

            injector:
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi

            ui:
              enabled: true
              externalPort: 8200
              targetPort: 8200
      destination:
        name: "{{.cluster}}"
        namespace: vault
      # The agent injector patches its own caBundle into this webhook at runtime.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          name: vault-agent-injector-cfg
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
