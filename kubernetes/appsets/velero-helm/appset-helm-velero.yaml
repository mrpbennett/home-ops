---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name velero
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        - list:
            elements:
              - cluster: portland
        - list:
            elements:
              - app_name: *app_name
                project: default
                clusterURL: "https://kubernetes.default.svc"
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: velero
        repoURL: https://vmware-tanzu.github.io/helm-charts
        targetRevision: 12.2.1
        helm:
          valuesObject:
            namespace:
              labels:
                pod-security.kubernetes.io/enforce: privileged
                pod-security.kubernetes.io/enforce-version: latest
                pod-security.kubernetes.io/audit: privileged
                pod-security.kubernetes.io/audit-version: latest
                pod-security.kubernetes.io/warn: privileged
                pod-security.kubernetes.io/warn-version: latest

            initContainers:
              - name: velero-plugin-for-aws
                image: velero/velero-plugin-for-aws:v1.13.0
                imagePullPolicy: IfNotPresent
                volumeMounts:
                  - mountPath: /target
                    name: plugins

            extraObjects:
              - apiVersion: secrets.hashicorp.com/v1beta1
                kind: VaultStaticSecret
                metadata:
                  name: seaweedfs-velero-creds
                spec:
                  vaultAuthRef: vault-secrets-operator/vault-auth
                  mount: kv
                  type: kv-v2
                  path: seaweedfs/velero
                  refreshAfter: 60s
                  destination:
                    name: seaweedfs-velero-creds
                    create: true
                    transformation:
                      template:
                        cloud: |
                          [default]
                          AWS_ACCESS_KEY_ID={{ "{{`{{ .Secrets.SEAWEEDFS_VELERO_AWS_ACCESS_KEY_ID }}`}}" }}
                          AWS_SECRET_ACCESS_KEY={{ "{{`{{ .Secrets.SEAWEEDFS_VELERO_AWS_SECRET_ACCESS_KEY }}`}}" }}

            configuration:
              backupStorageLocation:
                - name: default
                  provider: aws
                  bucket: velero
                  default: true
                  accessMode: ReadWrite
                  credential:
                    name: seaweedfs-velero-creds
                    key: cloud
                  config:
                    region: 70ld-west-1
                    s3ForcePathStyle: "true"
                    s3Url: http://192.168.6.2:8333
                    insecureSkipTLSVerify: "false"

              volumeSnapshotLocation: []

            credentials:
              useSecret: true
              existingSecret: seaweedfs-velero-creds

            schedules:
              daily-backup:
                disabled: false
                schedule: "0 1 * * *"
                template:
                  ttl: "72h0m0s"
                  storageLocation: default
                  includedNamespaces:
                    - "*"
                  excludedClusterScopedResources:
                    - persistentVolumeClaims
      destination:
        server: "{{.cluster}}"
        namespace: velero
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
