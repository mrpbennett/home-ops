---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name alloy
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ['missingkey=error']
  generators:
    - list:
        elements:
          - project: default
            app_name: *app_name
            cluster: portland
            clusterURL: 'https://kubernetes.default.svc'
  template:
    metadata:
      name: '{{.app_name}}'
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: '{{.project}}'
      source:
        chart: alloy
        repoURL: https://grafana.github.io/helm-charts
        targetRevision: 1.13.0
        helm:
          valuesObject:
            alloy:
              configMap:
                content: |
                  logging {
                    level = "warn"
                    format = "logfmt"
                  }

                  loki.write "grafana_loki" {
                    endpoint {
                      url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
                    }
                  }

                  discovery.kubernetes "pods" {
                    role = "pod"
                    selectors {
                      role  = "pod"
                      field = "spec.nodeName=" + coalesce(env("HOSTNAME"), constants.hostname)
                    }
                  }

                  discovery.relabel "pods" {
                    targets = discovery.kubernetes.pods.targets

                    rule {
                      source_labels = ["__meta_kubernetes_namespace"]
                      target_label  = "namespace"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_pod_name"]
                      target_label  = "pod"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_pod_container_name"]
                      target_label  = "container"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_pod_node_name"]
                      target_label  = "node"
                    }

                    // app: prefer app.kubernetes.io/name, fall back to the legacy "app" label
                    rule {
                      source_labels = ["__meta_kubernetes_pod_label_app"]
                      regex         = "(.+)"
                      target_label  = "app"
                    }

                    rule {
                      source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
                      regex         = "(.+)"
                      target_label  = "app"
                    }
                  }

                  loki.source.kubernetes "pods" {
                    targets    = discovery.relabel.pods.output
                    forward_to = [loki.write.grafana_loki.receiver]
                  }

              extraArgs: []

            serviceMonitor:
              enabled: true
      destination:
        name: '{{.cluster}}'
        namespace: logging
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Talos enforces the baseline Pod Security level by default; this app needs host access
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: privileged
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
