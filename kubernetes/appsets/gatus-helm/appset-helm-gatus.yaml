---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name gatus
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: gatus
        repoURL: https://twin.github.io/helm-charts
        targetRevision: 1.5.0
        helm:
          valuesObject:
            gateway:
              route:
                enabled: true
                path: /
                httpsRedirect: true
                parentRefs:
                  - name: envoy-shared-gateway
                    namespace: envoy-gateway-system
                    sectionName: https
                hosts:
                  - status.70ld.dev

            persistence:
              enabled: true
              size: 5Gi
              mountPath: /data
              accessMode:
                - ReadWriteOnce
              finalizers:
                - kubernetes.io/pvc-protection
              storageClassName: nfs-csi

            serviceMonitor:
              enabled: true
              namespace: monitoring
              interval: 1m
              path: /metrics
              scheme: http
              tlsConfig: {}
              labels: {}
              scrapeTimeout: 30s
              relabelings: []

            envFrom:
              - secretRef:
                  name: gatus-discord-webhook

            config:
              # https://github.com/TwiN/gatus#metrics
              # serves /metrics, which the ServiceMonitor scrapes
              metrics: true

              # https://github.com/TwiN/gatus#ui
              ui:
                title: "70LD : uk-south-1"
                description: Monitoring uk-south-1
                header: 70LD
                default-sort-by: group

              # https://github.com/TwiN/gatus#announcements
              announcements:
                - timestamp: 2025-11-07T12:00:00Z
                  type: information
                  message: "New monitoring dashboard features will be deployed next week"

              alerting:
                discord:
                  webhook-url: ${webhook_url}
                  default-alert:
                    description: "healthcheck failed"
                    header: 70LD
                    failure-threshold: 3
                    success-threshold: 2
                    send-on-resolved: true

              endpoints:
                # infra: nodes and cluster platform services
                - name: kube-cp-1
                  group: infra
                  url: "tcp://192.168.7.1:6443"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                - name: kube-cp-2
                  group: infra
                  url: "tcp://192.168.7.2:6443"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                - name: kube-cp-3
                  group: infra
                  url: "tcp://192.168.7.3:6443"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                # rpi
                - name: rpi-adguard
                  group: infra
                  url: "tcp://192.168.6.3:22"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                - name: rpi-seaweedfs
                  group: infra
                  url: "tcp://192.168.6.2:22"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                - name: rpi-nanoclaw
                  group: infra
                  url: "tcp://192.168.6.3:22"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                - name: vault
                  group: infra
                  # 200 active, 429 standby; sealed (503) or down fails
                  url: "http://vault.vault.svc:8200/v1/sys/health"
                  interval: 1m
                  conditions:
                    - "[STATUS] == any(200, 429)"
                  alerts: [{type: discord}]

                - name: argocd
                  group: infra
                  # argocd-server runs with server.insecure=true, so both service ports speak plain HTTP
                  url: "http://argocd-server.argocd.svc/healthz"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                  alerts: [{type: discord}]

                - name: longhorn
                  group: infra
                  url: "http://longhorn-frontend.longhorn-system.svc/"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                  alerts: [{type: discord}]

                - name: wildcard cert
                  group: infra
                  # exercises the gateway and checks the wildcard cert is not about to expire
                  url: "https://argocd.70ld.dev"
                  interval: 1h
                  conditions:
                    - "[CERTIFICATE_EXPIRATION] > 168h"
                  alerts: [{type: discord}]

                # apps: user-facing applications
                - name: homepage
                  group: apps
                  url: "http://homepage.homepage.svc:3000/api/healthcheck"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                  alerts: [{type: discord}]

                - name: headlamp
                  group: apps
                  url: "http://headlamp.headlamp.svc/"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                  alerts: [{type: discord}]

                - name: chartdb
                  group: apps
                  url: "http://chartdb.chartdb.svc/"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                  alerts: [{type: discord}]

                - name: docker-registry
                  group: apps
                  # 401 is fine if auth is enabled; it still proves the registry is serving
                  url: "http://docker-registry-svc.docker-registry.svc:5000/v2/"
                  interval: 1m
                  conditions:
                    - "[STATUS] == any(200, 401)"
                  alerts: [{type: discord}]

                - name: keycloak
                  group: apps
                  url: "http://keycloak.keycloak.svc:8080/realms/master"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                  alerts: [{type: discord}]

                # kubevirt - virtual machines
                - name: ubuntu-vm SSH
                  group: vms
                  url: "tcp://192.168.7.15:22"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                # data: databases and query engines
                - name: cloudnativepg
                  group: data
                  url: "tcp://192.168.7.80:5432"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]

                - name: trino
                  group: data
                  url: "http://trino.trino.svc:8080/v1/info"
                  interval: 1m
                  conditions:
                    - "[STATUS] == 200"
                    - "[BODY].starting == false"
                  alerts: [{type: discord}]

                - name: pgadmin
                  group: data
                  url: "tcp://192.168.7.99:5050"
                  interval: 1m
                  conditions:
                    - "[CONNECTED] == true"
                  alerts: [{type: discord}]


      destination:
        name: "{{.cluster}}"
        namespace: *app_name
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
