---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name trino
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: trino
        repoURL: https://trinodb.github.io/charts
        targetRevision: 1.42.2
        helm:
          valuesObject:
            server:
              workers: 2
              node:
                environment: production
                dataDir: /data/trino
                pluginDir: /usr/lib/trino/plugin
              log:
                trino:
                  level: INFO
              config:
                path: /etc/trino
                https:
                  enabled: false
                  port: 8443
                  keystore:
                    path: ""
                # authenticationType: "OAUTH2"
                authenticationType: "PASSWORD"
                query:
                  maxMemory: "2GB"
                  # coordinatorExtraConfig: |
                  #   web-ui.authentication.type=oauth2

            autoscaling:
              enabled: true
              maxReplicas: 5
              targetCPUUtilizationPercentage: ""
              targetMemoryUtilizationPercentage: 80
              behavior:
                scaleDown:
                  stabilizationWindowSeconds: 300
                  policies:
                    - type: Percent
                      value: 100
                      periodSeconds: 15
                scaleUp:
                  stabilizationWindowSeconds: 0
                  policies:
                    - type: Percent
                      value: 100
                      periodSeconds: 15
                    - type: Pods
                      value: 4
                      periodSeconds: 15
                  selectPolicy: Max

            # https://trino.io/docs/current/admin/properties.html
            additionalConfigProperties:
              # CHANGE: PASSWORD auth refuses plain HTTP by default; TLS is terminated at the envoy gateway
              - http-server.authentication.allow-insecure-over-http=true
              # CHANGE: trust X-Forwarded-* headers from the envoy gateway
              - http-server.process-forwarded=true
              # CHANGE: required for internal communication when authentication is enabled
              - internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
            # - http-server.process-forwarded=true
            # - http-server.authentication.type=oauth2
            #
            # - http-server.authentication.oauth2.issuer=https://keycloak.70ld.dev/realms/master
            # - http-server.authentication.oauth2.client-id=trino
            # - http-server.authentication.oauth2.scopes=openid,profile,email
            #
            # - internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SHARED_SECRET}
            # - http-server.authentication.oauth2.client-secret=${ENV:TRINO_OAUTH_CLIENT_SECRET}

            envFrom:
              - secretRef:
                  name: trino-secrets

            # CATALOGS
            catalogs:
              # CNPG Cluster main db [K8s]
              cloudnativepg-prod: |
                connector.name=postgresql
                connection-url=jdbc:postgresql://192.168.7.80:5432/main
                connection-user=${ENV:TRINO_CNPG_CATALOG_USERNAME}
                connection-password=${ENV:TRINO_CNPG_CATALOG_PASSWORD}

            service:
              type: LoadBalancer
              port: 8080
              annotations:
                metallb.universe.tf/loadBalancerIPs: 192.168.7.81

            # CHANGE: PASSWORD auth needs a password file; point at a pre-created secret
            # (key "password.db", htpasswd bcrypt: htpasswd -B -C 10 -c password.db <user>)
            auth:
              passwordAuthSecret: trino-password-auth
            # auth: {}

            coordinator:
              jvm:
                maxHeapSize: "2G"
                gcMethod:
                  type: "UseG1GC"
                  g1:
                    heapRegionSize: "16M"
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1500m"
                  memory: "2560Mi"

            worker:
              jvm:
                maxHeapSize: "2G"
                gcMethod:
                  type: "UseG1GC"
                  g1:
                    heapRegionSize: "16M"
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "1500m"
                  memory: "2560Mi"
              config:
                query:
                  maxMemoryPerNode: "1GB"

            kafka:
              mountPath: "/etc/trino/schemas"

            serviceMonitor:
              enabled: true
              labels:
                prometheus: kube-prometheus
              interval: 30s

            gateway:
              enabled: true
              parentRefs:
                - name: envoy-shared-gateway
                  namespace: envoy-gateway-system
                  sectionName: https
              hostnames:
                - trino.70ld.dev
              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /

      destination:
        name: "{{.cluster}}"
        namespace: "{{.app_name}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
