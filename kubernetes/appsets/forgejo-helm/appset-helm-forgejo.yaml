---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name forgejo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      source:
        chart: forgejo
        repoURL: oci://code.forgejo.org/forgejo-helm/forgejo
        targetRevision: 17.3.2
        helm:
          valuesObject:
            # NOTE: unlike the gitea chart, this chart bundles no postgres or valkey.
            # We use the cluster's CNPG; cache/session/queue stay on the in-process defaults.

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 768Mi

            service:
              http:
                type: ClusterIP
                port: 3000
              ssh:
                type: LoadBalancer
                port: 22
                annotations:
                  metallb.universe.tf/loadBalancerIPs: 192.168.7.16
                  external-dns.alpha.kubernetes.io/hostname: git-ssh.70ld.dev

            httpRoute:
              enabled: true
              # upstream gateway terminates TLS, so ROOT_URL becomes https://
              terminate: true
              parentRefs:
                - name: envoy-shared-gateway
                  namespace: envoy-gateway-system
                  sectionName: https
              hostnames:
                - git.70ld.dev

            replicaCount: 1

            # Longhorn (cluster default class). Git repos on NFS are slow and flaky.
            persistence:
              enabled: true
              create: true
              mount: true
              claimName: forgejo-shared-storage
              size: 10Gi
              accessModes:
                - ReadWriteOnce

            gitea:
              admin:
                existingSecret: forgejo-admin
                passwordMode: keepUpdated

              # DB password is injected as FORGEJO__DATABASE__PASSWD, never in git
              additionalConfigFromEnvs:
                - name: FORGEJO__DATABASE__PASSWD
                  valueFrom:
                    secretKeyRef:
                      name: forgejo-db
                      key: password

              config:
                APP_NAME: Forgejo
                server:
                  DOMAIN: git.70ld.dev
                  SSH_DOMAIN: git-ssh.70ld.dev
                database:
                  DB_TYPE: postgres
                  HOST: cnpg-prod-cluster-rw.cnpg-prod-cluster.svc.cluster.local:5432
                  NAME: forgejo
                  USER: forgejo
                # no self-signup; the admin creates accounts until Keycloak SSO is wired up
                service:
                  DISABLE_REGISTRATION: true

      destination:
        name: "{{.cluster}}"
        namespace: *app_name
      syncPolicy:
        automated:
          prune: true
        syncOptions:
          - CreateNamespace=true
          - SkipDryRunOnMissingResource=true
          - ApplyOutOfSyncOnly=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
