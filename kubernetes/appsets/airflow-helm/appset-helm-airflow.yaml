---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: &app_name airflow
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - cluster: portland
          - list:
              elements:
                - app_name: *app_name
                  project: default
                  repo_url: https://github.com/mrpbennett/home-ops.git
  template:
    metadata:
      name: "{{.app_name}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: "{{.project}}"
      sources:
        - chart: airflow
          repoURL: https://airflow.apache.org
          targetRevision: 1.22.0
          helm:
            valuesObject:
              ingress:
                enabled: true

                web:
                  enabled: true
                  annotations:
                    cert-manager.io/cluster-issuer: letsencrypt-cloudflare-dns-issuer
                  path: /
                  pathType: ImplementationSpecific
                  ingressClassName: nginx
                  hosts:
                    - name: airflow.70ld.dev
                      tls:
                        enabled: true
                        secretName: airflow-tls

              # https://airflow.apache.org/docs/helm-chart/stable/production-guide.html#webserver-secret-key
              webserverSecretKey: 7e7c86b29cf470c1181c656be339979b0448c336578338b357c00244b0e065df

              # Airflow Worker Config
              workers:
                replicas: 1
                resources:
                  limits:
                    cpu: 2000m
                    memory: 8Gi
                  requests:
                    cpu: 500m
                    memory: 6Gi

              # Airflow scheduler settings
              scheduler:
                resources:
                  limits:
                    cpu: 1000m
                    memory: 4Gi
                  requests:
                    cpu: 500m
                    memory: 2Gi

              # Number of Airflow API servers in the deployment
              apiServer:
                resources:
                  limits:
                    cpu: 1000m
                    memory: 2Gi
                  requests:
                    cpu: 500m
                    memory: 1Gi

                startupProbe:
                  initialDelaySeconds: 10
                  timeoutSeconds: 20
                  failureThreshold: 6
                  periodSeconds: 10
                  scheme: HTTP

              # Airflow webserver settings
              webserver:
                startupProbe:
                  initialDelaySeconds: 10

                resources:
                  limits:
                    cpu: 1000m
                    memory: 2Gi
                  requests:
                    cpu: 500m
                    memory: 1Gi

                defaultUser:
                  enabled: true
                  role: Admin
                  username: admin
                  password: admin
                  firstName: Paul
                  lastName: Bennett
                  email: pbennett.uk@outlook.com

              # Settings for ArgoCD
              createUserJob:
                useHelmHooks: false
                applyCustomEnv: false
              migrateDatabaseJob:
                useHelmHooks: false
                applyCustomEnv: false

              # Configuration for the redis provisioned by the chart
              redis:
                enabled: true
                terminationGracePeriodSeconds: 30

              # This runs as a CronJob to cleanup old pods.
              cleanup:
                enabled: true
                schedule: "0 01 * * *" # At 1am
                resources:
                  limits:
                    cpu: 100m
                    memory: 128Mi
                  requests:
                    cpu: 100m
                    memory: 128Mi

      destination:
        name: "{{.cluster}}"
        namespace: *app_name
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: -1 # retry forever; apps converge as their dependencies (CRDs, namespaces) appear
          backoff:
            duration: 5s
            maxDuration: 5m0s
            factor: 2
