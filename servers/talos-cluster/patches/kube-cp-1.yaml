---
# kube-cp-1 — per-node overrides. Shared settings (DNS, install disk, Longhorn mount) are in all-nodes.yaml.
apiVersion: v1alpha1
kind: HostnameConfig
auto: off
hostname: kube-cp-1
---
machine:
  network:
    interfaces:
      # Match the onboard NIC without hard-coding its name (eno1/enp0s31f6/...)
      - deviceSelector:
          physical: true
        dhcp: false
        addresses:
          - 192.168.7.1/22
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.4.1
        # Shared control-plane VIP; the Kubernetes API endpoint is https://192.168.7.200:6443
        vip:
          ip: 192.168.7.200
