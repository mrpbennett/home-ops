---
# Shared patch for every node, layered on the generated base config before patches/kube-cp-N.yaml.
# Don't `talosctl patch` live nodes with it: render and apply full configs instead (see ../mise.toml):
#   mise run talos:diff      # review live vs rendered
#   mise run talos:apply N   # one node at a time
#
# Talos 1.14 splits most settings into separate documents, so the old
# machine.install / machine.network.nameservers / cluster.allowSchedulingOnControlPlanes
# keys are rejected ("already set in v1alpha1 config"). Only the kubelet mount stays in the
# v1alpha1 block, because the KubeletConfig document has no extraMounts.
#
# Longhorn also needs the iscsi-tools and util-linux-tools system extensions,
# which come from the installer image (see ../schematic.yaml), not from this patch.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  # Image Factory image built from ../schematic.yaml so the extensions persist across upgrades
  image: factory.talos.dev/metal-installer/83848d3fcc873dd8b82510cc71cb6832ea59623fc2a7fd13d0fdad4535e3a97d:v1.14.2
provisioning:
  # Each OptiPlex has a single 1TB NVMe
  diskSelector:
    match: disk.dev_path == "/dev/nvme0n1"
  wipe: false
---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.4.2 # AdGuard
---
# All three nodes are control planes that also run workloads: drop the NoSchedule taint.
# A key-level `$patch: delete` on the taint fails ("lookup failed": the dots in the key are read as a
# path), so delete the whole document and recreate it without taints. Keep labels in sync with gen config.
apiVersion: v1alpha1
kind: KubeNodeConfig
$patch: delete
---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP: {}
labels:
  node-role.kubernetes.io/control-plane: ""
  node.kubernetes.io/exclude-from-external-load-balancers: ""
---
# Replace the KubeletConfig document with the v1alpha1 block so extraMounts can be set.
# Keep image/seccomp in sync with the values the generated config uses.
apiVersion: v1alpha1
kind: KubeletConfig
$patch: delete
---
cluster:
  etcd:
    extraArgs:
      # Expose etcd metrics for Prometheus (unauthenticated, read-only; LAN-only by design).
      # Needs a node reboot to take effect: etcd can't be restarted through the Talos API.
      listen-metrics-urls: http://0.0.0.0:2381
machine:
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.37.1
    defaultRuntimeSeccompProfileEnabled: true
    # Kubelet requests CA-signed serving certs; kubelet-serving-cert-approver approves the CSRs
    # so metrics-server can verify TLS to the kubelet
    extraArgs:
      rotate-server-certificates: "true"
    # Longhorn stores volume data here; it must be visible to the kubelet with shared propagation
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
---
# Raw block volumes (KubeVirt/CDI on longhorn-kubevirt) are opened by non-root pods (UID 107).
# containerd only chowns the device node from the pod's securityContext when this is set.
# Replaces the deprecated machine.files /etc/cri/conf.d/20-customization.part; applying it restarts CRI.
apiVersion: v1alpha1
kind: CRICustomizationConfig
name: device-ownership
content: |
  [plugins."io.containerd.cri.v1.runtime"]
    device_ownership_from_security_context = true
---
# kube-proxy metrics default to 127.0.0.1:10249, so Prometheus can't scrape them (TargetDown).
# Talos 1.14 rejects cluster.proxy alongside this document.
apiVersion: v1alpha1
kind: KubeProxyConfig
config:
  metricsBindAddress: 0.0.0.0:10249
---
# controller-manager and scheduler bind to 127.0.0.1 by default, so Prometheus can't scrape
# their secure metrics ports (TargetDown). The ports still require authentication.
# Talos 1.14 rejects cluster.controllerManager/cluster.scheduler alongside these documents.
apiVersion: v1alpha1
kind: KubeControllerManagerConfig
extraArgs:
  bind-address: 0.0.0.0
---
apiVersion: v1alpha1
kind: KubeSchedulerConfig
extraArgs:
  bind-address: 0.0.0.0
---
# Private registry ---
apiVersion: v1alpha1
kind: RegistryMirrorConfig
name: registry.70ld.dev:5000 # registry name as it appears in the image reference
endpoints:
  - url: https://registry.70ld.dev:5000
