---
# 70LD Cloud — inventory
# Single source of truth for regions, clusters, networks and hosts.
# Hostnames: <site>-<role>-<nn>. Numbers are never reused; retired hosts stay listed.
# TODO markers flag things to confirm against the real kit.

cloud:
  name: 70LD Cloud
  domain: 70ld.dev
  internal_domain: <service-name>.70ld.dev

regions:
  uk-dor-1:
    site_token: dor1
    description: Home site, Poole.
    status: active
    cidr: 192.168.4.0/22
    zones:
      uk-dor-1a:
        description: Main rack 1L
    vlans:
      - {id: 50, name: general, cidr: 192.168.4.0/24}
      - {id: 60, name: iot, cidr: 192.168.5.0/24}
      - {id: 20, name: servers, cidr: 192.168.6.0/24} # servers, pis, nas
      - {id: 30, name: k8s, cidr: 192.168.7.0/24,}

  uk-dor-2:
    site_token: dor2
    description: Home site, Poole.
    status: reserved
    cidr: 10.71.0.0/16
    zones:
      uk-dor-2a:
        description: Main rack 1 shelf X

clusters:
  uk-dor-1-prod-01:
    region: uk-dor-1
    env: prod
    distro: talos
    gitops: argocd
    pod_cidr: 10.100.0.0/16
    service_cidr: 10.101.0.0/16
    api_vip: 192.168.7.240
    api_fqdn: api.uk-dor-1-prod-01.int.70ld.dev
    lb_pool: 192.168.7.200-192.168.7.239
  uk-dor-1-dev-01:
    region: uk-dor-1
    env: dev
    distro: k3s
    gitops: argocd
    pod_cidr: 10.102.0.0/16
    service_cidr: 10.103.0.0/16
    api_vip: 192.168.6.241
    api_fqdn: api.uk-dor-1-dev-01.int.70ld.dev
    lb_pool: 192.168.6.220-192.168.6.239

hosts:
  # --- prod control planes ---
  - hostname: dor1-k8s-cp-01
    zone: uk-dor-1a
    role: cp
    description: K8s control plane
    cluster: uk-dor-1-prod-01
    ip: 192.168.7.1
    status: active
    hardware:
      - model: Dell OptiPlex 7060
        cpu: 6c
        ram: 16Gi
        storage: 1TB Nvme

  - hostname: dor1-k8s-cp-02
    zone: uk-dor-1a
    role: cp
    description: K8s control plane
    cluster: uk-dor-1-prod-01
    ip: 192.168.7.2
    status: active
    hardware:
      - model: Dell OptiPlex 7060
        cpu: 6c
        ram: 16Gi
        storage: 1TB Nvme

  - hostname: dor1-k8s-cp-03
    zone: uk-dor-1a
    role: cp
    description: K8s control plane
    cluster: uk-dor-1-prod-01
    ip: 192.168.7.3
    status: active
    hardware:
      - model: Dell OptiPlex 7060
        cpu: 6c
        ram: 16Gi
        storage: 1TB Nvme

  # --- Workers ---
  # future planning 
  - hostname: dor1-k8s-compute-01
    zone: uk-dor-1a
    role: compute node
    description: K8s node for hosting virtual machines and resource heavy pods
    cluster: uk-dor-1-prod-01
    ip: 192.168.7.4
    status: active
    hardware:
      - model: Dell OptiPlex 7020
        cpu: 14c
        ram: 64Gi
        storage: 1TB Nvme

  # --- Hypervisor ---
  - hostname: dor1-pve-01
    zone: uk-dor-1a
    role: Hypervisor
    cluster: ""
    hardware:
      - model: Dell OptiPlex 7090
        cpu: 14c
        ram: 32Gi
    ip: 192.168.7.10
    status: planned

  # --- dev cluster: Raspberry Pi 5, k3s ---
  - hostname: dor1-cp-01
    zone: uk-dor-1a
    role: cp
    cluster: uk-dor-1-dev-01
    hardware: rpi5
    ip: 192.168.6.1
    status: active
  - hostname: dor1-cp-02
    zone: uk-dor-1a
    role: cp
    cluster: uk-dor-1-dev-02
    hardware: rpi5
    ip: 192.168.6.2
    status: active
  - hostname: dor1-cp-03
    zone: uk-dor-1a
    role: cp
    cluster: uk-dor-1-dev-03
    hardware: rpi5
    ip: 192.168.6.3
    status: active

  # --- storage: Synology DS925+ ---
  - hostname: dor1-nas-01
    zone: uk-dor-1a
    role: nas
    hardware: ds925plus
    ip: 192.168.6.10
    services: [s3, smb, nfs, minecraft]
    status: active

  # --- network ---
  # TODO: fill in router/switch/AP models
  - hostname: dor1-gw-01
    zone: uk-dor-1a
    role: gw
    ip: 192.168.4.1
    status: active

buckets:
  - uk-dor-1-prod-01-longhorn
  - uk-dor-1-prod-01-etcd-backup
  - uk-dor-1-prod-01-cnpg-backup
  - uk-dor-1-prod-01-loki-admin
  - uk-dor-1-prod-01-loki-ruler
  - uk-dor-1-prod-01-loki-ruler
  - uk-dor-1-archive

retired: [] # move hosts here when decommissioned; never reuse their names
