---
# Combined media server stack.
# Source templates live in the per-app directories alongside this file.
name: media-svr

# ---------------------------------------------------------------------------
# Shared defaults
#
# Compose has no global "defaults" key, so these are YAML anchors stored in
# `x-` extension fields (ignored by compose) and pulled into a service with
# `<<: *name`. Merge keys only work on mappings, so list-valued keys such as
# volumes, ports and command still have to be written per service.
# ---------------------------------------------------------------------------

# Applied to every container.
x-common: &common
  restart: unless-stopped
  # Uncomment to cap log growth on every container (off by default so the
  # stack matches the upstream templates exactly).
  # logging:
  #   driver: json-file
  #   options:
  #     max-size: 10m
  #     max-file: "3"

# Docker host gateway - needed by jellyfin and open-webui.
x-host-gateway: &host-gateway
  extra_hosts:
    - host.docker.internal:host-gateway

# LinuxServer.io images (prowlarr, radarr, sonarr) all take these.
x-linuxserver-env: &linuxserver-env
  PUID: "1000"
  PGID: "1000"
  TZ: Etc/UTC

# Everything runs in UTC.
x-tz-env: &tz-env
  TZ: Etc/UTC

services:
  jellyfin:
    !!merge <<: [*common, *host-gateway]
    image: jellyfin/jellyfin
    container_name: jellyfin
    # Optional - specify the uid and gid you would like Jellyfin to use instead of root
    # user: uid:gid
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    volumes:
      - /path/to/config:/config
      - /path/to/cache:/cache
      - type: bind
        source: /path/to/media
        target: /media
      - type: bind
        source: /path/to/media2
        target: /media2
        read_only: true
      # Optional - extra fonts to be used during transcoding with subtitle burn-in
      - type: bind
        source: /path/to/fonts
        target: /usr/local/share/fonts/custom
        read_only: true
    environment:
      !!merge <<: *tz-env
      # Optional - alternative address used for autodiscovery
      JELLYFIN_PublishedServerUrl: http://example.com

  prowlarr:
    !!merge <<: *common
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment: *linuxserver-env
    volumes:
      - /path/to/prowlarr/data:/config
    ports:
      - 9696:9696

  radarr:
    !!merge <<: *common
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment: *linuxserver-env
    volumes:
      - /path/to/radarr/data:/config
      - /path/to/movies:/movies #optional
      - /path/to/download-client-downloads:/downloads #optional
    ports:
      - 7878:7878

  sonarr:
    !!merge <<: *common
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment: *linuxserver-env
    volumes:
      - /path/to/sonarr/data:/config
      - /path/to/tvseries:/tv #optional
      - /path/to/downloadclient-downloads:/downloads #optional
    ports:
      - 8989:8989

  seerr:
    !!merge <<: *common
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    container_name: seerr
    environment:
      !!merge <<: *tz-env
      LOG_LEVEL: debug
      PORT: "5055" #optional
    ports:
      - 5055:5055
    volumes:
      - /path/to/appdata/config:/app/config
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL

  open-webui:
    !!merge <<: [*common, *host-gateway]
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    environment:
      !!merge <<: *tz-env
      WEBUI_SECRET_KEY: your-secret-key

volumes:
  open-webui:
